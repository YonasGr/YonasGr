  <circle cx="820" cy="260" r="160" fill="#8B5CF6" opacity=".32" filter="url(#blur)"><animate attributeName="cx" values="820;600;820" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="260;120;260" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="320" r="110" fill="#22D3EE" opacity=".18" filter="url(#blur)"><animate attributeName="cx" values="520;300;520" dur="18s" repeatCount="indefinite"/></circle>
