<text x="500" y="232" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="25" fill="#C7D2FE" opacity="0">FastAPI · TypeScript · PostgreSQL<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3999;0.4250;0.5750;0.6000;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="500" y="232" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="25" fill="#C7D2FE" opacity="0">Cloud &amp; DevOps · Azure + Docker<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5999;0.6250;0.7750;0.8000;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="500" y="232" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="25" fill="#C7D2FE" opacity="0">Building systems that thrive in production<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7999;0.8250;0.9750;1.0000;1" dur="16.0s" repeatCount="indefinite"/></text>

  <g transform="translate(40 306)">
    <circle cx="6" cy="0" r="6" fill="#10B981"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
