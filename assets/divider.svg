<svg xmlns="http://www.w3.org/2000/svg" width="940" height="24" viewBox="0 0 940 24" role="img" aria-label="divider">
<title>divider</title>
<defs>
  <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#111A3A"/></linearGradient>
  <linearGradient id="brandd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F8EF7"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <filter id="blurd" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glowd" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<line x1="0" y1="12" x2="940" y2="12" stroke="#2A3566" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
<circle cy="12" r="5" fill="#22D3EE" filter="url(#glowd)"><animate attributeName="cx" values="0;940;0" dur="9s" repeatCount="indefinite"/></circle>
<circle cy="12" r="3" fill="#8B5CF6"><animate attributeName="cx" values="940;0;940" dur="9s" repeatCount="indefinite"/></circle>
</svg>
