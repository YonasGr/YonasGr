<svg xmlns="http://www.w3.org/2000/svg" width="940" height="84" viewBox="0 0 940 84" role="img" aria-label="Live activity">
<title>Live activity</title>
<defs>
  <linearGradient id="bgactivity" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#111A3A"/></linearGradient>
  <linearGradient id="brandactivity" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F8EF7"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <filter id="bluractivity" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glowactivity" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="940" height="84" rx="14" fill="url(#bgactivity)"/>
<rect x=".5" y=".5" width="939" height="83" rx="14" fill="none" stroke="#2A3566"/>
<rect x="0" y="18" width="5" height="48" rx="2.5" fill="url(#brandactivity)"/>
<text x="28" y="34" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#22D3EE">// 06</text>
<text x="28" y="64" font-family="'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="28" fill="#F1F5F9">Live activity</text>
<text x="912" y="48" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#64748B">auto-updated from GitHub</text>
<rect x="0" y="81" width="140" height="3" fill="url(#brandactivity)"><animate attributeName="x" values="-140;940" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>
