name: Update README (live activity)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - scripts/update_readme.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No setup-python: it has no prebuilt Python for Fedora, and this
      # script is pure standard library, so the system python3 is enough.
      - name: Check Python
        run: python3 --version

      - name: Refresh auto-generated sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_readme.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh live activity [skip ci]"
            git push
          fi
